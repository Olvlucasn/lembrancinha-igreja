<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lembrancinha Especial</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: 'Georgia', serif;
      color: #f0e6d3;
      padding: 20px;
    }

    .card {
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    .cruz {
      font-size: 28px;
      letter-spacing: 4px;
      color: #d4af37;
      margin-bottom: 8px;
    }

    .evento-titulo {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #a89060;
      margin-bottom: 28px;
    }

    .foto-wrapper {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      margin: 0 auto 20px;
      border: 3px solid #d4af37;
      overflow: hidden;
      background: rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .foto-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .foto-placeholder {
      font-size: 60px;
      opacity: 0.4;
    }

    .nome {
      font-size: 26px;
      font-weight: bold;
      color: #f0e6d3;
      margin-bottom: 6px;
    }

    .mensagem-de {
      font-size: 13px;
      color: #a89060;
      margin-bottom: 28px;
      font-style: italic;
    }

    .audio-section {
      background: rgba(212,175,55,0.1);
      border: 1px solid rgba(212,175,55,0.3);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .audio-titulo {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #d4af37;
      margin-bottom: 14px;
    }

    audio {
      width: 100%;
      border-radius: 8px;
      accent-color: #d4af37;
    }

    .rodape {
      font-size: 12px;
      color: #6b6b8a;
      line-height: 1.6;
    }

    .loading {
      font-size: 16px;
      color: #a89060;
      padding: 40px 0;
    }

    .erro {
      background: rgba(255,80,80,0.1);
      border: 1px solid rgba(255,80,80,0.3);
      border-radius: 12px;
      padding: 20px;
      color: #ff9090;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="loading">Carregando sua surpresa... ✨</div>
  </div>

  <script>
    // ==============================================================
    // CONFIGURE AQUI
    // ==============================================================
    const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR9XpLkTT94kaVXDuAqjKWucanyw8S6Lr4axKTQBsn27ScgGb2vB1lTFd6N56o2TJYT53YwYX2nOS_a/pub?output=csv";
    const NOME_DO_EVENTO = "Impacto Rdical 2026"; // edite o nome do evento
    // ==============================================================

    function getParam(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    function parseCSV(text) {
      const lines = text.trim().split("\n");
      const headers = lines[0].split(",").map(h => h.trim().replace(/^"|"$/g, ""));
      return lines.slice(1).map(line => {
        const vals = line.match(/(".*?"|[^,]+)(?=,|$)/g) || [];
        const obj = {};
        headers.forEach((h, i) => {
          obj[h] = (vals[i] || "").replace(/^"|"$/g, "").trim();
        });
        return obj;
      });
    }

    function render(pessoa) {
      const card = document.getElementById("card");
      card.innerHTML = `
        <div class="cruz">✝</div>
        <div class="evento-titulo">${NOME_DO_EVENTO}</div>

        <div class="foto-wrapper">
          ${pessoa.foto_url
            ? `<img src="${pessoa.foto_url}" alt="Foto de ${pessoa.nome}" onerror="this.parentElement.innerHTML='<div class=foto-placeholder>🙏</div>'">`
            : `<div class="foto-placeholder">🙏</div>`}
        </div>

        <div class="nome">${pessoa.nome}</div>
        <div class="mensagem-de">Uma mensagem especial para você</div>

        <div class="audio-section">
          <div class="audio-titulo">🎙️ Ouça sua mensagem</div>
          ${pessoa.audio_url
            ? `<audio controls><source src="${pessoa.audio_url}">Seu navegador não suporta áudio.</audio>`
            : `<p style="color:#a89060;font-size:13px;">Áudio em breve...</p>`}
        </div>

        <div class="rodape">
          Com carinho e fé 🙏<br>
          ${NOME_DO_EVENTO}
        </div>
      `;
    }

    function renderErro(msg) {
      document.getElementById("card").innerHTML = `<div class="erro">${msg}</div>`;
    }

    async function init() {
      const id = getParam("id");
      if (!id) { renderErro("Link inválido. Nenhum ID encontrado."); return; }
      try {
        const res = await fetch(SHEET_URL);
        const text = await res.text();
        const dados = parseCSV(text);
        const pessoa = dados.find(d => d.id === id);
        if (!pessoa) { renderErro(`Pessoa "${id}" não encontrada.`); return; }
        render(pessoa);
      } catch (e) {
        renderErro("Erro ao carregar os dados. Verifique a planilha.");
      }
    }

    init();
  </script>
</body>
</html>
